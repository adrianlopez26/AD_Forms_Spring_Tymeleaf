<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>Formulario Productos</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        form {
            background-color: #f9f9f9;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        fieldset {
            border: none;
        }
        legend {
            font-size: 1.5em;
            margin-bottom: 10px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="submit"] {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        input[type="submit"]:hover {
            background-color: #45a049;
        }
        .product-list {
            margin-top: 20px;
        }
        .product-item {
            background-color: #f1f1f1;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
<form th:action="@{/nuevo}" th:object="${producto}">
    <fieldset>
        <legend>Añade tu producto:</legend>
        <p>
            <label for="nombre">Nombre del producto</label>
            <input type="text" th:field="*{nombre}" id="nombre" required>
        </p>
        <p>
            <label for="precio">Precio:</label>
            <input type="number" th:field="*{precio}" id="precio" step="0.1" required min="0.01">
        </p>
        <p>
            <label for="cantidad">Cantidad:</label>
            <input type="number" th:field="*{cantidad}" id="cantidad" required min="1">
        </p>
        <p>
            <input type="submit" value="Añadir nuevo producto">
        </p>
    </fieldset>
</form>

<h2>Carrito Compra</h2>
<div class="product-list" th:each="producto : ${carrito.getProductos()}">
    <div class="product-item">
        <p>
            <strong>Nombre:</strong> <span th:text="${producto.nombre}"></span><br>
            <strong>Cantidad:</strong> <span th:text="${producto.cantidad}"></span><br>
            <strong>Precio:</strong> <span th:text="${producto.precio}"></span> €
        </p>
    </div>
</div>
</body>
</html>
